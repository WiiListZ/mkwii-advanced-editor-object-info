name: Build Object Info Editor for Windows
on:
  workflow_dispatch:
  push:
    tags: ['editor-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-build.txt
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ObjectInfoEditor-windows
          path: |
            dist/ObjectInfoEditor.exe
            dist/ObjectInfoEditor.exe.sha256
            dist/README.md
